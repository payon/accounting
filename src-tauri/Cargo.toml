[package]
name = "payon"
version = "1.0.0"
description = "복식부기 회계: 청구서, 지출, 은행 거래, 계좌 대조, 재무보고서"
edition = "2021"
rust-version = "1.81"

[lib]
name = "payon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
